const SHOW = 5;
const KEY = "hashing-problems-v1";

let state = { done: {}, good: {} };
let canSave = true;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const s = JSON.parse(raw); if (s && s.done && s.good) state = s; }
  localStorage.setItem(KEY + "-test", "1"); localStorage.removeItem(KEY + "-test");
} catch (e) { canSave = false; }
if (!canSave) document.getElementById("warn").style.display = "block";

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { document.getElementById("warn").style.display = "block"; }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tagsHtml(p, expanded) {
  if (p.gfg) return '<span class="src">GFG</span>';
  const list = expanded ? p.companies : p.companies.slice(0, SHOW);
  let h = list.map(c => '<span class="tag">[' + esc(c[0]) + ']</span>').join("");
  const rest = p.companies.length - list.length;
  if (rest > 0) h += '<button class="more" type="button" data-more="1" title="Show all ' + p.companies.length + ' companies">+' + rest + ' more</button>';
  return h;
}
function titleHtml(p) {
  return p.links.map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a>').join(' <span class="amp">&amp;</span> ');
}

const root = document.getElementById("sections");
SECTIONS.forEach((sec, si) => {
  const wrap = document.createElement("div");
  wrap.className = "sec"; wrap.id = "sec-" + si;
  const top = document.createElement("div"); top.className = "sec-head";
  top.innerHTML = '<h2>' + esc(sec.title) + '</h2><div class="stat"><span class="lbl">solved</span>' + ring(si, 64, 7, true) + '</div>';
  wrap.appendChild(top);
  wrap.insertAdjacentHTML("beforeend",
    '<div class="head"><span></span><span></span>' +
    '<span class="c"><span class="hd good">GOOD ONE :)</span></span>' +
    '<span class="c"><span class="hd done">DONE</span></span></div>');
  const list = document.createElement("div");
  sec.items.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.id = p.id;
    row._p = p;
    row.innerHTML =
      '<span class="ord">' + (i + 1) + '.</span>' +
      '<span class="t">' + titleHtml(p) + '<span class="tags">' + tagsHtml(p, false) + '</span></span>' +
      '<span class="c"><input type="checkbox" class="cb-good" aria-label="Good one"></span>' +
      '<span class="c"><input type="checkbox" class="cb-done" aria-label="Done"></span>';
    row.querySelector(".cb-good").checked = !!state.good[p.id];
    row.querySelector(".cb-done").checked = !!state.done[p.id];
    row.classList.toggle("is-done", !!state.done[p.id]);
    list.appendChild(row);
  });
  wrap.appendChild(list);
  root.appendChild(wrap);
});

// A problem that appears in more than one place shares one tick everywhere.
function syncRows(id) {
  document.querySelectorAll(".row").forEach(r => {
    if (r.dataset.id !== id) return;
    r.querySelector(".cb-good").checked = !!state.good[id];
    r.querySelector(".cb-done").checked = !!state.done[id];
    r.classList.toggle("is-done", !!state.done[id]);
  });
}

root.addEventListener("change", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const id = row.dataset.id;
  if (e.target.classList.contains("cb-done")) {
    if (e.target.checked) state.done[id] = 1; else delete state.done[id];
  }
  if (e.target.classList.contains("cb-good")) {
    if (e.target.checked) state.good[id] = 1; else delete state.good[id];
  }
  syncRows(id);
  updateCounts();
  save();
});
root.addEventListener("click", e => {
  const b = e.target.closest("[data-more]"); if (!b) return;
  const row = b.closest(".row");
  row.querySelector(".tags").innerHTML = tagsHtml(row._p, true);
});
// ---- progress rings ----
function ring(si, size, stroke, withText) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, m = size / 2;
  return '<span class="ring" data-ring="' + si + '" style="width:' + size + 'px;height:' + size + 'px">' +
    '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle class="trk" cx="' + m + '" cy="' + m + '" r="' + r + '" stroke-width="' + stroke + '"/>' +
    '<circle class="bar" cx="' + m + '" cy="' + m + '" r="' + r + '" stroke-width="' + stroke + '" data-c="' + c + '" ' +
    'stroke-dasharray="0 ' + c + '" transform="rotate(-90 ' + m + ' ' + m + ')"/></svg>' +
    (withText ? '<b class="rt"></b>' : '') + '</span>';
}
function updateCounts() {
  SECTIONS.forEach((sec, si) => {
    const total = sec.items.length;
    const done = sec.items.filter(p => state.done[p.id]).length;
    document.querySelectorAll('[data-ring="' + si + '"]').forEach(el => {
      const bar = el.querySelector(".bar"), c = parseFloat(bar.getAttribute("data-c"));
      bar.setAttribute("stroke-dasharray", (total ? c * done / total : 0) + " " + c);
      const t = el.querySelector(".rt"); if (t) t.textContent = done + "/" + total;
      el.classList.toggle("full", total > 0 && done === total);
    });
    document.querySelectorAll('[data-cnt="' + si + '"]').forEach(el => { el.textContent = done + "/" + total; });
  });
}

// ---- header navigation (one topic per page) ----
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-");
const nav = document.getElementById("nav");
nav.innerHTML = SECTIONS.map((s, i) =>
  '<button type="button" class="tab" data-tab="' + i + '">' + ring(i, 30, 4.5, false) +
  '<span>' + esc(s.title) + '</span><span class="tc" data-cnt="' + i + '"></span></button>').join("");
function showTab(i) {
  document.querySelectorAll(".sec").forEach((el, k) => el.classList.toggle("active", k === i));
  document.querySelectorAll(".tab").forEach((el, k) => el.classList.toggle("on", k === i));
  window.scrollTo(0, 0);
  try { localStorage.setItem(KEY + "-tab", String(i)); } catch (e) {}
  try { history.replaceState(null, "", "#" + slug(SECTIONS[i].title)); } catch (e) {}
}
nav.addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  showTab(parseInt(b.dataset.tab, 10));
});
function startTab() {
  let i = -1;
  try { i = SECTIONS.findIndex(s => slug(s.title) === decodeURIComponent(location.hash.slice(1))); } catch (e) {}
  if (i < 0) { try { i = parseInt(localStorage.getItem(KEY + "-tab"), 10); } catch (e) {} }
  if (!(i >= 0 && i < SECTIONS.length)) i = 0;
  showTab(i);
}
updateCounts();
startTab();
</script>
