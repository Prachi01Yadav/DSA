  * { box-sizing: border-box; }
  body {

  .page { max-width: 860px; margin: 0 auto; padding: 56px 24px 80px; }

  .sub { color: #777; margin: 0 0 18px; }

  }
  .head { padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px solid #eee; }
  .c { text-align: center; }

  .hd.done { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }

  .row { padding: 4px 0; }
  .row:hover { background: #fafafa; }
  .ord { text-align: right; padding-right: 10px; color: #111; font-variant-numeric: tabular-nums; }
  .t a { color: #1a1ab0; text-decoration: underline; }
  .t a:visited { color: #1a1ab0; }
  .tag { color: #c2570c; font-weight: 700; font-size: 12px; margin-left: 8px; white-space: nowrap; }
  .more { color: #999; font-size: 12px; margin-left: 8px; cursor: pointer; background: none; border: 0; padding: 0; font-family: inherit; }
  .more:hover { color: #555; text-decoration: underline; }
  .src { color: #999; font-size: 11px; margin-left: 8px; }

  .row.is-done .t a { color: #9a9a9a; text-decoration: line-through; }
  .row.is-done .ord { color: #9a9a9a; }

  input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; margin: 0; vertical-align: middle; }
  input.cb-good { accent-color: #d97706; }
  input.cb-done { accent-color: #16a34a; }

  .warn { display: none; margin: 0 0 16px; padding: 8px 12px; background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; font-size: 13px; border-radius: 6px; }

  @media (max-width: 600px) {
    .page { padding: 28px 14px 60px; }
    h1 { font-size: 28px; }
    .head, .row { grid-template-columns: 28px 1fr 68px 68px; }
    .hd { font-size: 10px; padding: 2px 7px; white-space: normal; line-height: 1.2; }
    .ord { padding-right: 6px; }
  }
</style>
</head>

const SHOW = 5;
const KEY = "math-problems-v1";

let state = { done: {}, good: {} };
let canSave = true;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const s = JSON.parse(raw); if (s && s.done && s.good) state = s; }
  localStorage.setItem(KEY + "-test", "1"); localStorage.removeItem(KEY + "-test");
} catch (e) { canSave = false; }
if (!canSave) document.getElementById("warn").style.display = "block";

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { document.getElementById("warn").style.display = "block"; }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const idOf = p => p.num ? "lc" + p.num : "gfg-" + p.name.toLowerCase().replace(/\W+/g, "-");

function tagsHtml(p, expanded) {
  if (p.gfg) return '<span class="src">GFG</span>';
  const list = expanded ? p.companies : p.companies.slice(0, SHOW);
  let h = list.map(c => '<span class="tag">[' + esc(c[0]) + ']</span>').join("");
  const rest = p.companies.length - list.length;
  if (rest > 0) h += '<button class="more" type="button" data-more="1" title="Show all ' + p.companies.length + ' companies">+' + rest + ' more</button>';
  return h;
}

const list = document.getElementById("list");
DATA.forEach((p, i) => {
  const id = idOf(p);
  const row = document.createElement("div");
  row.className = "row";
  row.dataset.id = id;
  row._p = p;
  row.innerHTML =
    '<span class="ord">' + (i + 1) + '.</span>' +
    '<span class="t"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.name) + '</a><span class="tags">' + tagsHtml(p, false) + '</span></span>' +
    '<span class="c"><input type="checkbox" class="cb-good" aria-label="Good one"></span>' +
    '<span class="c"><input type="checkbox" class="cb-done" aria-label="Done"></span>';
  row.querySelector(".cb-good").checked = !!state.good[id];
  row.querySelector(".cb-done").checked = !!state.done[id];
  row.classList.toggle("is-done", !!state.done[id]);
  list.appendChild(row);
});

list.addEventListener("change", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const id = row.dataset.id;
  if (e.target.classList.contains("cb-done")) {
    if (e.target.checked) state.done[id] = 1; else delete state.done[id];
    row.classList.toggle("is-done", e.target.checked);
  }
  if (e.target.classList.contains("cb-good")) {
    if (e.target.checked) state.good[id] = 1; else delete state.good[id];
  }
  save();
});
list.addEventListener("click", e => {
  const b = e.target.closest("[data-more]"); if (!b) return;
  const row = b.closest(".row");
  row.querySelector(".tags").innerHTML = tagsHtml(row._p, true);
});
</script>
